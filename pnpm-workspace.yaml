  alien-signals: ^3.2.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0

catalogMode: prefer

overrides:
  vite@*: "catalog:"

peerDependencyRules:
